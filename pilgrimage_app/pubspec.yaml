name: pilgrimage_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_maps_flutter: ^2.12.3
  #google_street_view: ^2.0.0
  flutter_lints: ^5.0.0
  flutter_dotenv: ^5.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  google_sign_in: ^7.1.1
  intl: ^0.19.0
  image_picker: ^1.2.1
  firebase_storage: ^13.0.4
  image_cropper: ^11.0.0
  flutter_launcher_icons: ^0.14.4
  audioplayers: ^6.5.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image_dir/app_icon.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/information/
    - assets/image_dir/
    - assets/music_dir/

